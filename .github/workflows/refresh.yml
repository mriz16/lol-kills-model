name: refresh-data

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download OE data and write parquet
        run: python scripts/refresh_data.py
      - name: Commit updated parquet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.parquet data/teams.parquet
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: refresh Oracle's Elixir parquet ($(date -u +%F))"
            git push
          fi
