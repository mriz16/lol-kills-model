name: refresh-data

on:
  schedule:
    # Three times a day: Google Drive throttles OE's popular CSVs ("Too many users have
    # viewed or downloaded this file recently"), so a blocked run is retried hours later
    # instead of leaving the data a day behind. A run with no new games commits nothing.
    - cron: "17 3 * * *"
    - cron: "17 11 * * *"
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      years:
        description: "Space-separated years to download (default: last + current)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Repo variable (Settings -> Secrets and variables -> Actions -> Variables).
      # Empty falls back to the default folder id in scripts/refresh_data.py.
      OE_DRIVE_FOLDER_ID: ${{ vars.OE_DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache key for finished years
        id: cachekey
        run: echo "key=oe-csv-v1-$(( $(date -u +%Y) - 1 ))" >> "$GITHUB_OUTPUT"
      - name: Restore finished years' OE CSVs
        # Last year's CSV no longer changes: keep it in the Actions cache so each run only
        # downloads the current year from Drive (half the requests that hit the quota).
        id: oecache
        uses: actions/cache/restore@v4
        with:
          path: .oe_cache
          key: ${{ steps.cachekey.outputs.key }}
      - name: Download OE data, audit, write parquet
        # Exits non-zero (failing the job) on HTML downloads, 0 rows, missing OE columns,
        # no in-scope games, or parquet over 50 MB.
        env:
          YEARS: ${{ inputs.years }}
        run: |
          if [ -n "$YEARS" ]; then
            [[ "$YEARS" =~ ^[0-9\ ]+$ ]] || { echo "::error::years must be digits/spaces"; exit 1; }
            python scripts/refresh_data.py --years $YEARS
          else
            python scripts/refresh_data.py --cache-dir .oe_cache
          fi
      - name: Save finished years' OE CSVs
        # Saved even when this year's download failed, so the next run skips last year.
        if: always() && steps.oecache.outputs.cache-hit != 'true' && hashFiles('.oe_cache/*.csv') != ''
        uses: actions/cache/save@v4
        with:
          path: .oe_cache
          key: ${{ steps.cachekey.outputs.key }}
      - name: Publish audit to job summary
        if: always()
        run: |
          if [ -f reports/data_audit.md ]; then cat reports/data_audit.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Commit updated parquet and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.parquet data/teams.parquet reports/data_audit.md
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: refresh Oracle's Elixir parquet ($(date -u +%F))"
            git push
          fi
      - name: Grade logged picks and the slate log (picks-log branch)
        # Also runs when the download failed: grading against the committed parquet is
        # still correct, it just has fewer finished series.
        if: ${{ !cancelled() }}
        # The app logs played picks to logs/picks.csv and every entered line to
        # logs/slates.csv on the picks-log branch (GitHub API). Grade both against the
        # fresh parquet and commit logs/graded.csv + logs/slates_graded.csv to that branch.
        run: |
          if ! git ls-remote --exit-code --heads origin picks-log >/dev/null; then
            echo "no picks-log branch yet (nothing logged)"; exit 0
          fi
          git fetch origin picks-log
          git worktree add --detach "$RUNNER_TEMP/picks-log" origin/picks-log
          python scripts/grade_picks.py --log-root "$RUNNER_TEMP/picks-log"
          cd "$RUNNER_TEMP/picks-log"
          git add -f logs/graded.csv 2>/dev/null || true
          git add -f logs/slates_graded.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "no grading changes"; exit 0; fi
          git commit -m "log: grade picks ($(date -u +%F))"
          for i in 1 2 3; do
            git push origin HEAD:picks-log && exit 0
            git fetch origin picks-log && git rebase origin/picks-log
          done
          exit 1
