name: refresh-data

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:
    inputs:
      years:
        description: "Space-separated years to download (default: last + current)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Repo variable (Settings -> Secrets and variables -> Actions -> Variables).
      # Empty falls back to the default folder id in scripts/refresh_data.py.
      OE_DRIVE_FOLDER_ID: ${{ vars.OE_DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download OE data, audit, write parquet
        # Exits non-zero (failing the job) on HTML downloads, 0 rows, missing OE columns,
        # no in-scope games, or parquet over 50 MB.
        env:
          YEARS: ${{ inputs.years }}
        run: |
          if [ -n "$YEARS" ]; then
            [[ "$YEARS" =~ ^[0-9\ ]+$ ]] || { echo "::error::years must be digits/spaces"; exit 1; }
            python scripts/refresh_data.py --years $YEARS
          else
            python scripts/refresh_data.py
          fi
      - name: Publish audit to job summary
        if: always()
        run: |
          if [ -f reports/data_audit.md ]; then cat reports/data_audit.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Commit updated parquet and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.parquet data/teams.parquet reports/data_audit.md
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: refresh Oracle's Elixir parquet ($(date -u +%F))"
            git push
          fi
      - name: Grade logged picks (picks-log branch)
        # The app logs played picks to logs/picks.csv on the picks-log branch (GitHub API).
        # Grade them against the fresh parquet and commit logs/graded.csv to that branch.
        run: |
          if ! git ls-remote --exit-code --heads origin picks-log >/dev/null; then
            echo "no picks-log branch yet (nothing logged)"; exit 0
          fi
          git fetch origin picks-log
          git worktree add --detach "$RUNNER_TEMP/picks-log" origin/picks-log
          python scripts/grade_picks.py --log-root "$RUNNER_TEMP/picks-log"
          cd "$RUNNER_TEMP/picks-log"
          git add -f logs/graded.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "no grading changes"; exit 0; fi
          git commit -m "log: grade picks ($(date -u +%F))"
          for i in 1 2 3; do
            git push origin HEAD:picks-log && exit 0
            git fetch origin picks-log && git rebase origin/picks-log
          done
          exit 1
